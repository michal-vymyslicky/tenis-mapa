name: Denní aktualizace turnajů

on:
  schedule:
    - cron: "23 0 * * *"   # denně 0:23 UTC (1:23 v zimě / 2:23 v létě v ČR) – noc = nejmenší zátěž webu ČTS
  workflow_dispatch: {}      # ruční spuštění z karty Actions
  push:                      # nahrání nové verze webu = rychlé nasazení bez stahování dat
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/aktualizace.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # běžný běh ~20–40 min (1 vlákno, 1,5 s mezi stránkami); nová sezóna poprvé geokóduje všechna místa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Knihovny Leaflet (pokud v repozitáři chybí)
        run: |
          mkdir -p site/vendor/images
          [ -f site/vendor/leaflet.js ] || for f in leaflet.js leaflet.css images/marker-icon.png; do curl -sfL "https://unpkg.com/leaflet@1.9.4/dist/$f" -o "site/vendor/$f"; done
          [ -f site/vendor/leaflet.markercluster.js ] || for f in leaflet.markercluster.js MarkerCluster.css MarkerCluster.Default.css; do curl -sfL "https://unpkg.com/leaflet.markercluster@1.5.3/dist/$f" -o "site/vendor/$f"; done
      - name: Stažení listin ČTS (aktuální a nadcházející sezóna) a přepočet dat
        if: github.event_name != 'push'
        env:
          TZ: Europe/Prague
        run: |
          if [ -f data/clubs.json ]; then python3 pipeline/update.py --auto; else python3 pipeline/update.py --auto --kluby; fi
          python3 pipeline/kontrola_mist.py || true
      - name: Uložení změn dat do repozitáře
        if: github.event_name != 'push'
        run: |
          git config user.name "tenismapa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data site/vendor
          git diff --cached --quiet || git commit -m "Data turnajů $(date +%F)"
          git pull --rebase --autostash || true
          git push
      # Nasazení webu: tady jen při push (nová verze webu). Po denní aktualizaci nasazuje samostatný workflow
      # nasazeni.yml (workflow_run) z NOVÉHO commitu s daty – nasazení ze stejného commitu, který už byl nasazen
      # (checkout běhu = předchozí commit), GitHub Pages tiše přeskočí (10. 11. 2026 web zůstal na datech z 9. 11.).
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site
      - id: deploy
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
