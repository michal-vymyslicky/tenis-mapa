name: Denní aktualizace turnajů

on:
  schedule:
    - cron: "17 3 * * *"   # denně 3:17 UTC (4:17 / 5:17 v ČR)
  workflow_dispatch: {}      # ruční spuštění z karty Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # první běh geokóduje všechna místa (≈ 1 h), další běhy jen nová
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Knihovny Leaflet (pokud v repozitáři chybí)
        run: |
          mkdir -p site/vendor/images
          [ -f site/vendor/leaflet.js ] || for f in leaflet.js leaflet.css images/marker-icon.png; do curl -sfL "https://unpkg.com/leaflet@1.9.4/dist/$f" -o "site/vendor/$f"; done
          [ -f site/vendor/leaflet.markercluster.js ] || for f in leaflet.markercluster.js MarkerCluster.css MarkerCluster.Default.css; do curl -sfL "https://unpkg.com/leaflet.markercluster@1.5.3/dist/$f" -o "site/vendor/$f"; done
      - name: Stažení listiny ČTS a přepočet dat
        env:
          SEZONA: Z2627
          TZ: Europe/Prague
        run: |
          if [ -f data/clubs.json ]; then python3 pipeline/update.py; else python3 pipeline/update.py --kluby; fi
          python3 pipeline/kontrola_mist.py
      - name: Uložení změn dat do repozitáře
        run: |
          git config user.name "tenismapa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data site/vendor
          git diff --cached --quiet || git commit -m "Data turnajů $(date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
