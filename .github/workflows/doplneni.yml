name: Doplnění sezóny (archiv)

on:
  workflow_dispatch:
    inputs:
      sezona:
        description: "Sezóna, např. Z2526 nebo L26 (více oddělte mezerou)"
        required: true
      vlakna:
        description: "Souběžná stahování (šetrně 1)"
        default: "1"
      pauza:
        description: "Pauza mezi stránkami v sekundách"
        default: "1.5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualizace
  cancel-in-progress: false

jobs:
  doplneni:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Stažení sezóny
        env:
          TZ: Europe/Prague
        run: |
          ARGS=""; for s in ${{ github.event.inputs.sezona }}; do ARGS="$ARGS --sezona $s"; done
          python3 pipeline/update.py $ARGS --vlakna ${{ github.event.inputs.vlakna }} --pauza ${{ github.event.inputs.pauza }}
      - name: Uložení dat
        run: |
          git config user.name "tenismapa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data site/data
          git diff --cached --quiet || git commit -m "Doplnění sezóny ${{ github.event.inputs.sezona }}"
          git pull --rebase --autostash || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
