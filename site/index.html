<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12372A">
<title>Tenisová mapa turnajů</title>
<meta name="description" content="Mapa turnajů jednotlivců ČTS – filtr podle termínu, kategorie, třídy, povrchu a vzdálenosti.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23C8521F'/%3E%3Cpath d='M5 9c6 3 6 11 0 14M27 9c-6 3-6 11 0 14' stroke='%23fff' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"></span><div><strong>Tenisová mapa</strong><small id="seasonLabel">turnaje ČTS</small></div></div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-panel="filters" aria-label="Filtry"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span>Filtry</span><b class="badge" id="filterBadge" hidden></b></button>
    <button class="tab" data-panel="list" aria-label="Seznam"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Seznam</span><b class="badge" id="countBadge"></b></button>
    <button class="tab" data-panel="favs" aria-label="Oblíbené"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Oblíbené</span><b class="badge" id="favBadge" hidden></b></button>
  </nav>
</header>

<main id="app">
  <div id="map" aria-label="Mapa turnajů"></div>
  <div class="mapctl">
    <button id="btnLocate" title="Moje poloha" aria-label="Moje poloha"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg></button>
    <button id="btnPick" title="Vybrat bod v mapě" aria-label="Vybrat bod v mapě"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
    <button id="btnLegend" title="Legenda" aria-label="Legenda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </div>
  <div id="pickHint" class="hint" hidden>Klepněte do mapy na místo, od kterého se počítá okruh.</div>
  <div id="legend" class="legend" hidden></div>
  <div id="status" class="status">Načítám turnaje…</div>

  <section id="sheet" class="sheet" aria-live="polite" hidden>
    <div class="grip" id="grip"><span></span></div>
    <button class="close" id="sheetClose" aria-label="Zavřít">×</button>

    <div class="panel" data-panel="filters">
      <h2>Filtry</h2>
      <fieldset>
        <legend>Termín</legend>
        <div class="row2">
          <label>Od<input type="date" id="fFrom"></label>
          <label>Do<input type="date" id="fTo"></label>
        </div>
        <div class="chips" id="datePresets">
          <button data-p="weekend">Tento víkend</button><button data-p="nextweekend">Příští víkend</button>
          <button data-p="d14">14 dní</button><button data-p="d30">30 dní</button><button data-p="all">Celá sezóna</button>
        </div>
      </fieldset>
      <fieldset><legend>Kategorie</legend><div class="chips multi" id="fCat"></div></fieldset>
      <fieldset><legend>Pohlaví</legend><div class="chips multi" id="fSex"></div></fieldset>
      <fieldset><legend>Třída turnaje</legend><div class="chips multi" id="fClass"></div></fieldset>
      <fieldset><legend>Povrch</legend><div class="chips multi" id="fSurf"></div></fieldset>
      <fieldset>
        <legend>Okruh</legend>
        <div class="chips" id="fCenterMode">
          <button data-c="none">Celá ČR</button><button data-c="gps">Moje poloha</button><button data-c="pick">Bod v mapě</button>
        </div>
        <form id="placeForm" class="search"><input id="placeQ" type="search" placeholder="Hledat obec / adresu…" autocomplete="off"><button>Najít</button></form>
        <div id="placeRes" class="placeres"></div>
        <div id="centerInfo" class="muted"></div>
        <label class="range">Vzdálenost do <b id="radiusVal">50 km</b><input type="range" id="fRadius" min="5" max="300" step="5" value="50"></label>
      </fieldset>
      <fieldset>
        <legend>Další</legend>
        <label class="search"><input id="fText" type="search" placeholder="Klub, název, obec…"></label>
        <label class="check"><input type="checkbox" id="fFree"> jen s volnými místy (podle obsazenosti)</label>
        <label class="check"><input type="checkbox" id="fCancelled" checked> zobrazit i zrušené turnaje</label>
        <label class="check"><input type="checkbox" id="fGuess" checked> zobrazit turnaje s odhadnutým místem</label>
      </fieldset>
      <div class="actions"><button id="btnReset" class="ghost">Vymazat filtry</button><button id="btnShow" class="primary">Zobrazit <span id="showCount"></span></button></div>
    </div>

    <div class="panel" data-panel="list">
      <h2>Turnaje <small id="listInfo"></small></h2>
      <div class="chips" id="listSort"><button data-s="date" class="on">Podle data</button><button data-s="dist">Podle vzdálenosti</button></div>
      <div id="listBody"></div>
    </div>

    <div class="panel" data-panel="favs">
      <h2>Oblíbené</h2>
      <div class="actions small"><button id="btnShare" class="ghost">Sdílet odkaz</button><button id="btnIcs" class="ghost">Do kalendáře (.ics)</button><button id="btnFavMap" class="ghost">Jen oblíbené v mapě</button></div>
      <div id="favImport" hidden></div>
      <div id="favBody"></div>
    </div>

    <div class="panel" data-panel="detail"><div id="detailBody"></div></div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
